<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>겨울 단독콘서트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:720px;margin:auto;padding:24px 18px 50px}.hero{text-align:center;padding:38px 0}.ey{letter-spacing:4px;font-size:11px;color:#9ba3b2}.title{font-size:38px;font-weight:900;margin:12px}.date{color:#cdd2db}.card{background:#12161f;border:1px solid #29303d;border-radius:20px;padding:22px;margin-top:18px}
.notice{text-align:center;border:1px dashed #414957;border-radius:15px;padding:24px}.clock{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;margin:10px}
.stage{width:72%;margin:0 auto 25px;text-align:center;background:#eef1f5;color:#111;padding:11px;border-radius:8px;font-weight:900;letter-spacing:3px}
.seats{display:flex;justify-content:center;gap:10px}.seat{width:78px;height:60px;border-radius:12px;border:1px solid #505867;background:#171c25;color:white;font-weight:800;cursor:pointer}.seat.selected{background:#fff;color:#111}.seat.sold{background:#464d59;color:#8e96a4;cursor:not-allowed;text-decoration:line-through}
input{width:100%;padding:14px;background:#0b0e13;border:1px solid #343b48;border-radius:12px;color:white;margin:18px 0 12px;font-size:15px}
button.reserve{width:100%;padding:15px;border:0;border-radius:12px;font-weight:900;font-size:16px;background:#f2f4f7;color:#111}button:disabled{opacity:.35}
.ticket{background:linear-gradient(135deg,#1b202b,#0d1016);border:1px solid #5a6372;border-radius:18px;padding:24px}.ticketno{font-size:12px;color:#aeb5c2;letter-spacing:2px}.qr{width:160px;height:160px;background:repeating-linear-gradient(45deg,#fff 0 4px,#111 4px 8px);border:10px solid white;margin:18px auto}
.hidden{display:none}.msg{text-align:center;color:#ffb4b4;margin-top:10px;font-size:13px}
</style></head><body><div class="wrap">
<div class="hero"><div class="ey">WINTER SOLO CONCERT</div><div class="title">겨울 단독콘서트</div><div class="date">2026. 10. 11 SUN · 13:00</div></div>
<section id="lock" class="card"><div class="notice"><div>티켓 오픈까지</div><div id="clock" class="clock">--:--:--</div><div id="locktext">오늘 16:00 티켓 오픈</div></div></section>
<section id="book" class="card hidden"><h2>좌석 선택</h2><div class="stage">STAGE</div><div id="seats" class="seats"></div>
<input id="name" placeholder="예매자 이름 또는 닉네임" maxlength="20"><button id="go" class="reserve" disabled>예매하기</button><div id="msg" class="msg"></div></section>
<section id="ticket" class="card hidden"><div class="ticket"><div class="ticketno" id="tn"></div><h2>겨울 단독콘서트</h2><p>2026. 10. 11 SUN · 13:00</p><p id="who"></p><p id="seat"></p><div class="qr"></div><div style="text-align:center;color:#aeb5c2;font-size:12px">입장 시 이 화면을 보여주세요.</div></div></section>
</div>
<script>
let status=null,selected=null;
async function get(){const r=await fetch("/api/status");status=await r.json();render()}
function render(){
 const open=status?.open;
 document.getElementById("lock").classList.toggle("hidden",open);
 document.getElementById("book").classList.toggle("hidden",!open);
 const sold=new Set((status?.reservations||[]).map(x=>x.seat));
 const box=document.getElementById("seats"); box.innerHTML="";
 (status?.seats||["A1","A2","A3","A4","A5"]).forEach(s=>{const b=document.createElement("button");b.className="seat";b.textContent=s;
 if(sold.has(s)){b.classList.add("sold");b.disabled=true}else if(selected===s)b.classList.add("selected");
 b.onclick=()=>{selected=s;document.getElementById("go").disabled=!document.getElementById("name").value.trim();render()};box.appendChild(b)});
}
function clock(){if(!status)return;const d=Math.max(0,new Date(status.openAt)-new Date());const h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);document.getElementById("clock").textContent=d?"".concat(String(h).padStart(2,"0"),":",String(m).padStart(2,"0"),":",String(s).padStart(2,"0")):"OPEN";if(d===0)get()}
document.getElementById("name").oninput=()=>document.getElementById("go").disabled=!(selected&&document.getElementById("name").value.trim());
document.getElementById("go").onclick=async()=>{const r=await fetch("/api/reserve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value.trim(),seat:selected})});const j=await r.json();if(!r.ok){document.getElementById("msg").textContent=j.error;selected=null;await get();return}
document.getElementById("book").classList.add("hidden");document.getElementById("ticket").classList.remove("hidden");document.getElementById("tn").textContent=j.ticket.ticketNo;document.getElementById("who").textContent="예매자: "+j.ticket.name;document.getElementById("seat").textContent="좌석: "+j.ticket.seat};
get();setInterval(clock,250);setInterval(get,3000);
</script></body></html>
